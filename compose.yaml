services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: boca
      POSTGRES_USER: boca
      POSTGRES_PASSWORD: boca
    volumes:
      - boca-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boca -d boca"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  boca-data:
